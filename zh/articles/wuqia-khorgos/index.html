    <h1>乌恰还是霍尔果斯：0.4%只在一条路上</h1>
    <p>0.4% 不是运费。它是乌恰过吉尔吉斯时，按货物发票价值计的税。霍尔果斯过哈萨克，不加这项。</p>
    <p>两条走廊到德黑兰场站都约 22 天。网页不比哪条更便宜。运费单询。</p>
    <p>马什哈德、德黑兰、萨拉赫斯：场站交货。</p>
